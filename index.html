<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#075e54"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Paciência"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/patience.png"><title>Paciência</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font:16px Inter,system-ui,sans-serif;color:#172b2d;background:#e9e3dc}.hidden{display:none!important}button,input{font:inherit}button{border:0;cursor:pointer}.auth{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#064e46,#0e766b);padding:20px}.card{width:min(430px,100%);padding:32px;border-radius:22px;background:#fff;box-shadow:0 20px 60px #00262266}.brand{font-size:1.3rem;font-weight:800;color:#075e54}.mark{display:inline-grid;place-items:center;background:#075e54;color:#fff;width:36px;height:36px;border-radius:12px;margin-right:8px}.card h1{margin:18px 0 5px}.muted{color:#617576;line-height:1.45}.field{display:block;margin-top:15px;font-weight:700;font-size:.9rem}.field input,.compose input,#inviteCode{width:100%;height:46px;margin-top:7px;padding:0 13px;border:1px solid #d5dddd;border-radius:10px;outline-color:#075e54}.primary{width:100%;margin-top:20px;height:47px;border-radius:11px;background:#075e54;color:#fff;font-weight:800}.switch,.copy{width:100%;background:none;color:#087a5c;margin-top:12px}.notice{min-height:21px;margin:12px 0 0;color:#617576;font-size:.87rem}.error{color:#b3261e}.app{height:100vh;max-width:1420px;margin:auto;display:grid;grid-template-columns:390px 1fr;background:#fff;overflow:hidden}.side{display:flex;flex-direction:column;border-right:1px solid #ddd}.top{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#f6f8f8}.icon{background:none;border-radius:50%;width:40px;height:40px;font-size:1.1rem;color:#416164}.icon:hover{background:#e4eeee}.me{margin:12px 14px 7px;padding:12px;background:#eaf7f2;border-radius:12px}.code{display:flex;justify-content:space-between;margin-top:5px;color:#087a5c;font-size:.87rem}.copy{width:auto;margin:0;font-weight:700}.search{margin:6px 14px 10px;background:#f4f6f6;padding:0 13px;border-radius:10px;height:43px;display:flex;align-items:center;gap:8px}.search input{border:0;background:none;outline:0;width:100%}.list{overflow:auto}.contact{display:grid;grid-template-columns:50px 1fr auto;gap:12px;width:100%;padding:13px 16px;background:#fff;text-align:left;border-bottom:1px solid #eee}.contact:hover,.active{background:#f1f7f5}.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#137b70;color:#fff;font-weight:800}.preview{display:block;margin-top:4px;color:#687c7d;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:.72rem;color:#7b8e8f}.chat{display:flex;flex-direction:column;background-color:#efeae2;background-image:radial-gradient(#d8d0c5 1px,transparent 1px);background-size:18px 18px}.chathead{height:76px;background:#f6f8f8;display:flex;justify-content:space-between;align-items:center;padding:0 20px;border-bottom:1px solid #ddd}.chatinfo{display:flex;align-items:center;gap:12px}.chatinfo h2{font-size:1rem;margin:0}.chatinfo p{margin:3px 0 0;color:#617576;font-size:.78rem}.messages{flex:1;overflow:auto;padding:28px clamp(16px,5vw,76px)}.message{width:max-content;max-width:min(72%,580px);padding:9px 11px 7px;margin:8px 0;border-radius:8px;border-top-left-radius:2px;background:#fff;box-shadow:0 1px 1px #00000014;line-height:1.4}.mine{margin-left:auto;background:#d9fdd3;border-radius:8px;border-top-right-radius:2px}.meta{float:right;margin:4px 0 0 12px;color:#77908e;font-size:.68rem}.compose{display:flex;gap:10px;padding:12px 18px;background:#f5f5f5}.compose input{flex:1;margin:0;border:0;border-radius:24px}.send{width:45px;height:45px;border-radius:50%;background:#075e54;color:#fff}.empty{display:grid;place-items:center;text-align:center;flex:1;padding:2rem;color:#617576}.modal{position:fixed;inset:0;background:#001f1d66;display:grid;place-items:center;padding:20px}.modal .card{width:min(400px,100%)}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.secondary{padding:11px 15px;border-radius:9px;background:#edf1f1}.actions .primary{width:auto;margin:0;padding:0 17px}@media(max-width:720px){.app{grid-template-columns:1fr}.chat{display:none}.app.open .side{display:none}.app.open .chat{display:flex}.back{display:inline-block!important}.message{max-width:88%}}.back{display:none}
</style></head><body>
<section id="auth" class="auth"><div class="card"><div class="brand"><span class="mark">✦</span>Conecta</div><h1 id="authTitle">Crie sua conta</h1><p id="authText" class="muted">Você receberá um código único para convidar pessoas.</p><form id="authForm"><label id="nameLabel" class="field">Seu nome<input id="name" required autocomplete="name"></label><label class="field">E-mail<input id="email" required type="email" autocomplete="email"></label><label class="field">Senha<input id="password" required minlength="6" type="password" autocomplete="current-password"></label><button id="authButton" class="primary">Criar conta</button></form><button id="mode" class="switch">Já tenho uma conta</button><p id="authNotice" class="notice"></p></div></section>
<main id="app" class="app hidden"><aside class="side"><header class="top"><div class="brand"><span class="mark">✦</span>Conecta</div><div><button id="new" class="icon" aria-label="Nova conversa">✎</button><button id="out" class="icon" aria-label="Sair">↪</button></div></header><div class="me"><b id="myName">…</b><div class="code">Seu código: <strong id="myCode">…</strong><button id="copy" class="copy">Copiar</button></div></div><label class="search">⌕<input id="search" placeholder="Pesquisar conversas"></label><div id="list" class="list"></div></aside><section id="chat" class="chat"><div class="empty"><div><strong>Conversas privadas, de verdade.</strong><p>Use o ícone ✎ e informe o código da outra pessoa para começar.</p></div></div></section></main>
<section id="modal" class="modal hidden"><div class="card"><h2>Nova conversa</h2><p class="muted">Digite o código único da pessoa.</p><form id="inviteForm"><input id="inviteCode" placeholder="CNC-AB12CD34" required><p id="inviteNotice" class="notice"></p><div class="actions"><button id="cancel" class="secondary" type="button">Cancelar</button><button class="primary">Conversar</button></div></form></div></section>
<script>
const sb=supabase.createClient('https://zpzzajhhoqfnbfjmxext.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpwenphamhob3FmbmJmam14ZXh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MTc0MzAsImV4cCI6MjA5NjI5MzQzMH0.JaDOtOkwgiKwurM01mrW432dKAq47CwWYiMbaCxCwQk');let user,profile,rows=[],active,signup=true,channel;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','>':'&gt;','<':'&lt;','"':'&quot;'}[x])),note=(el,s,b=false)=>{el.textContent=s;el.classList.toggle('error',b)},time=x=>new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'}).format(new Date(x));
const av=n=>`<span class="avatar">${esc(n.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())}</span>`;
async function boot(u){user=u;try{let r=await sb.from('chat_profiles').select('*').eq('id',u.id).single();if(r.error)throw r.error;profile=r.data;$('#myName').textContent=profile.display_name;$('#myCode').textContent=profile.user_code;await load();$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');if(channel)sb.removeChannel(channel);channel=sb.channel('conecta-'+u.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{load();if(active?.id===p.new.conversation_id)messages()}).subscribe()}catch(e){note($('#authNotice'),'Falta executar a migração atualizada do Conecta no SQL Editor do Supabase.',true);console.error(e)}}
async function load(){let r=await sb.from('conversation_members').select('conversation_id,conversations(id,created_at,conversation_members(user_id),messages(content,created_at,sender_id))').eq('user_id',user.id);if(r.error){$('#list').innerHTML='<p class="notice">Não foi possível carregar conversas.</p>';return}let ids=[...new Set(r.data.flatMap(x=>x.conversations.conversation_members.map(m=>m.user_id)).filter(id=>id!==user.id))],p=ids.length?await sb.from('chat_profiles').select('id,display_name,user_code').in('id',ids):{data:[],error:null};if(p.error){$('#list').innerHTML='<p class="notice">Não foi possível carregar contatos.</p>';return}let lookup=Object.fromEntries(p.data.map(x=>[x.id,x]));rows=r.data.map(x=>{let c=x.conversations,o=lookup[c.conversation_members.find(m=>m.user_id!==user.id)?.user_id],last=[...c.messages].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];return {...c,o,last}}).filter(x=>x.o).sort((a,b)=>new Date(b.last?.created_at||b.created_at)-new Date(a.last?.created_at||a.created_at));list()}
function list(){let q=$('#search').value.toLowerCase();$('#list').innerHTML=rows.filter(c=>c.o.display_name.toLowerCase().includes(q)||c.last?.content.toLowerCase().includes(q)).map(c=>`<button class="contact ${active?.id===c.id?'active':''}" data-id="${c.id}">${av(c.o.display_name)}<span><b>${esc(c.o.display_name)}</b><span class="preview">${esc(c.last?.content||'Comece a conversa')}</span></span><span class="time">${c.last?time(c.last.created_at):''}</span></button>`).join('')||'<p class="notice" style="padding:15px">Nenhuma conversa ainda.</p>';document.querySelectorAll('.contact').forEach(x=>x.onclick=()=>open(x.dataset.id))}
async function open(id){active=rows.find(x=>x.id===id);$('#app').classList.add('open');list();$('#chat').innerHTML=`<header class="chathead"><div class="chatinfo"><button id="back" class="icon back">‹</button>${av(active.o.display_name)}<div><h2>${esc(active.o.display_name)}</h2><p>Código: ${esc(active.o.user_code)}</p></div></div><button id="new2" class="icon">✎</button></header><div id="messages" class="messages"></div><form id="sendForm" class="compose"><input id="message" maxlength="2000" autocomplete="off" placeholder="Mensagem"><button class="send">➤</button></form>`;$('#back').onclick=()=>$('#app').classList.remove('open');$('#new2').onclick=invite;$('#sendForm').onsubmit=send;messages()}
async function messages(){if(!active)return;let r=await sb.from('messages').select('*').eq('conversation_id',active.id).order('created_at');$('#messages').innerHTML=r.error?'<p class="notice">Erro ao carregar.</p>':r.data.map(m=>`<div class="message ${m.sender_id===user.id?'mine':''}">${esc(m.content)}<span class="meta">${time(m.created_at)}</span></div>`).join('')||'<p class="notice">Envie a primeira mensagem.</p>';let b=$('#messages');b.scrollTop=b.scrollHeight}
async function send(e){e.preventDefault();let i=$('#message'),content=i.value.trim();if(!content)return;let r=await sb.from('messages').insert({conversation_id:active.id,sender_id:user.id,content});if(r.error)return alert(r.error.message);i.value='';messages();load()}
function invite(){$('#modal').classList.remove('hidden');$('#inviteCode').focus()}$('#cancel').onclick=()=>$('#modal').classList.add('hidden');$('#new').onclick=invite;$('#inviteForm').onsubmit=async e=>{e.preventDefault();note($('#inviteNotice'),'Criando conversa…');let r=await sb.rpc('create_conversation_by_code',{invite_code:$('#inviteCode').value.trim().toUpperCase()});if(r.error)return note($('#inviteNotice'),r.error.message,true);$('#modal').classList.add('hidden');await load();open(r.data)};
$('#search').oninput=list;$('#copy').onclick=async()=>{await navigator.clipboard.writeText(profile.user_code);$('#copy').textContent='Copiado!';setTimeout(()=>$('#copy').textContent='Copiar',1200)};$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};$('#mode').onclick=()=>{signup=!signup;$('#authTitle').textContent=signup?'Crie sua conta':'Entre na sua conta';$('#authText').textContent=signup?'Você receberá um código único para convidar pessoas.':'Acesse suas conversas privadas.';$('#nameLabel').classList.toggle('hidden',!signup);$('#name').required=signup;$('#authButton').textContent=signup?'Criar conta':'Entrar';$('#mode').textContent=signup?'Já tenho uma conta':'Ainda não tenho conta';note($('#authNotice'),'')};$('#authForm').onsubmit=async e=>{e.preventDefault();let email=$('#email').value.trim(),password=$('#password').value,r=signup?await sb.auth.signUp({email,password,options:{data:{display_name:$('#name').value.trim()}}}):await sb.auth.signInWithPassword({email,password});if(r.error)return note($('#authNotice'),r.error.message,true);if(!r.data.session)return note($('#authNotice'),'Conta criada. Confirme o e-mail para entrar.');boot(r.data.user)};sb.auth.getSession().then(r=>r.data.session&&boot(r.data.session.user));
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script></body></html>
