let callPC,callStream,currentCall,pendingCandidates=[],callChannels={};const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};function setupCallChannels(){rows.forEach(c=>{if(callChannels[c.id])return;callChannels[c.id]=sb.channel('audio-'+c.id).on('broadcast',{event:'signal'},({payload})=>handleSignal(c,payload)).subscribe()})}function showCall(c,status,incoming=false){$('#callAvatar').innerHTML=av(c.o.display_name,c.o.avatar_url);$('#callName').textContent=c.o.display_name;$('#callStatus').textContent=status;$('#acceptCall').classList.toggle('hidden',!incoming);$('#callModal').classList.remove('hidden')}function sendSignal(type,data={}){let c=currentCall?.conversation;if(c)callChannels[c.id].send({type:'broadcast',event:'signal',payload:{type,id:currentCall.id,from:user.id,to:c.o.id,...data}})}async function makePeer(){callPC=new RTCPeerConnection(ICE);callStream=await navigator.mediaDevices.getUserMedia({audio:true});callStream.getTracks().forEach(t=>callPC.addTrack(t,callStream));callPC.onicecandidate=e=>e.candidate&&sendSignal('candidate',{candidate:e.candidate.toJSON()});callPC.onconnectionstatechange=()=>{if(callPC?.connectionState==='connected')$('#callStatus').textContent='Em ligação';if(['failed','disconnected','closed'].includes(callPC?.connectionState))endCall(false)}}async function startAudioCall(c){try{currentCall={id:crypto.randomUUID(),conversation:c};showCall(c,'Ligando…');await makePeer();let offer=await callPC.createOffer();await callPC.setLocalDescription(offer);sendSignal('offer',{description:offer})}catch(e){alert('Não foi possível usar o microfone: '+e.message);endCall(false)}}async function handleSignal(c,p){if(p.to!==user.id)return;if(p.type==='offer'&&!currentCall){currentCall={id:p.id,conversation:c,offer:p.description};showCall(c,'Ligação recebida',true);return}if(!currentCall||p.id!==currentCall.id)return;if(p.type==='answer'){await callPC.setRemoteDescription(p.description);for(const x of pendingCandidates)await callPC.addIceCandidate(x);pendingCandidates=[]}if(p.type==='candidate'){let x=new RTCIceCandidate(p.candidate);if(callPC?.remoteDescription)await callPC.addIceCandidate(x);else pendingCandidates.push(x)}if(p.type==='end')endCall(false)}async function acceptAudioCall(){try{showCall(currentCall.conversation,'Conectando…');await makePeer();await callPC.setRemoteDescription(currentCall.offer);let answer=await callPC.createAnswer();await callPC.setLocalDescription(answer);sendSignal('answer',{description:answer});for(const x of pendingCandidates)await callPC.addIceCandidate(x);pendingCandidates=[]}catch(e){alert('Não foi possível atender: '+e.message);endCall(true)}}function endCall(notify=true){if(notify&&currentCall)sendSignal('end');callStream?.getTracks().forEach(t=>t.stop());callPC?.close();callPC=null;callStream=null;currentCall=null;pendingCandidates=[];$('#callModal').classList.add('hidden')}$('#acceptCall').onclick=acceptAudioCall;$('#endCall').onclick=()=>endCall(true);
